spring.application.name=ms-catalogo
server.port=${SERVER_PORT:8082}

# Entra ID (validacion JWT, continuidad EP1)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/a2d774d1-6d61-457f-8298-3217272b8234/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=7ec7e5ba-9693-4758-9e2f-73c0900cd68d

# ===== RDS Catalogo (exclusiva de este microservicio) =====
# Valores reales en variables de entorno (archivo catalogo.env en la EC2, fuera del repo)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:catalogo_db}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Las tablas se crean con sql/01_rds_catalogo.sql; Hibernate no modifica el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== RabbitMQ (EC2 C, por IP privada) =====
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones del broker y retornos por falta de ruta (laboratorio)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados en el panel de RabbitMQ (Paso 3)
app.rabbitmq.exchange=catalogo.exchange
app.rabbitmq.routing-key=categoria.creada
app.rabbitmq.confirm-timeout-seconds=10

logging.level.cl.duoc=INFO
