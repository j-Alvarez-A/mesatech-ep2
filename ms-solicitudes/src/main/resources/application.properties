spring.application.name=ms-solicitudes
server.port=${SERVER_PORT:8081}

# Entra ID (validacion JWT, continuidad EP1)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/a2d774d1-6d61-457f-8298-3217272b8234/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=7ec7e5ba-9693-4758-9e2f-73c0900cd68d

# ===== RDS Solicitudes (exclusiva de este microservicio) =====
# Valores reales en variables de entorno (archivo solicitudes.env en la EC2, fuera del repo)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:solicitudes_db}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Las tablas se crean con sql/02_rds_solicitudes.sql; Hibernate no modifica el esquemassh -i "C:\Users\jorge\Downloads\mesatech.pem" ubuntu@3.88.13.108
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== RabbitMQ (EC2 C, por IP privada) =====
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Consumir un mensaje a la vez
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
# AUTO: el ack se envia SOLO si el listener termina sin excepcion (despues de guardar en RDS)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# Si falla el guardado (ej. RDS caida) el mensaje vuelve a la cola
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# Si la cola no existe al arrancar, no detener la aplicacion (reintenta)
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Cola creada en el panel de RabbitMQ (Paso 3)
app.rabbitmq.queue=solicitudes.catalogo.queue

logging.level.cl.duoc=INFO
